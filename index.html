<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Private Food Radar | 私房美食雷達</title>

  <style>
    :root {
      --primary-blue: #1976d2;
      --primary-blue-hover: #1565c0;
      --active-tab-bg: #eef6fc;
      --text-title: #202124;
      --text-sub: #5f6368;
      --border-gray: #e0e0e0;
      --hint-bg: #fef9e7;
      --hint-border: #f9e79f;
      --hint-text: #7d6608;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    /* 全螢幕地圖 */
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* 頂部浮動白色圓角控制卡片 (完全對齊截圖質感) */
    .floating-control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 第一行：動態發現狀態 + 回到目前位置 */
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-title);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      background-color: #2e7d32;
      border-radius: 50%;
      display: inline-block;
    }
    .btn-recenter {
      background: var(--primary-blue);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-recenter:active {
      background: var(--primary-blue-hover);
    }

    /* 第二行：不換行 Segmented Controls 按鈕列 (3格均分) */
    .radar-button-group {
      display: flex;
      background: #f1f3f4;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
      overflow: hidden;
    }
    .radar-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 7px 0;
      font-size: 0.85rem;
      color: var(--text-sub);
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .radar-btn.active {
      background: #ffffff;
      color: var(--primary-blue);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    /* 第三行：操作說明提示列 */
    .hint-box {
      background: var(--hint-bg);
      border: 1px solid var(--hint-border);
      color: var(--hint-text);
      font-size: 0.72rem;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: center;
    }

    /* Google Maps 自訂彈出卡片樣式 (完全對齊截圖彈窗) */
    .info-card {
      padding: 8px;
      max-width: 270px;
      color: var(--text-title);
      font-family: inherit;
    }
    .info-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-blue);
      margin-bottom: 6px;
    }
    .info-badge-box {
      background: #eef6fc;
      color: #1565c0;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      line-height: 1.35;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .info-line {
      font-size: 0.8rem;
      color: #3c4043;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .info-dist {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 6px;
      margin-bottom: 10px;
    }
    .info-nav-btn {
      display: block;
      width: 100%;
      background: var(--primary-blue);
      color: #ffffff !important;
      text-align: center;
      text-decoration: none;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- 頂部浮動控制面板 -->
  <div class="floating-control-panel">
    <div class="status-row">
      <div class="status-title">
        <span class="status-dot"></span>
        <span id="statusText">正在搜尋周邊好店...</span>
      </div>
      <button class="btn-recenter" id="recenterBtn">回到目前位置</button>
    </div>

    <!-- 不換行、等寬 3 格按鈕列 -->
    <div class="radar-button-group" id="radarButtons">
      <button class="radar-btn active" data-idx="0">7 分鐘 (500m)</button>
      <button class="radar-btn" data-idx="1">10 分鐘 (750m)</button>
      <button class="radar-btn" data-idx="2">15 分鐘 (1.1km)</button>
    </div>

    <!-- 原始黃底提示框 -->
    <div class="hint-box">
      💡 直接點擊地圖任一處，或長按藍色圓點後拖曳，即可更改搜尋中心
    </div>
  </div>

  <!-- 地圖容器 -->
  <div id="map"></div>

  <script>
    // ==========================================
    // ⚙️ 集中設定區：三段步行半徑與視角
    // ==========================================
    const RADAR_CONFIG = {
      defaultIndex: 0,
      options: [
        { minutes: 7, meters: 500, zoom: 16.5, label: "7 分鐘 (500m)" },
        { minutes: 10, meters: 750, zoom: 16.0, label: "10 分鐘 (750m)" },
        { minutes: 15, meters: 1100, zoom: 15.4, label: "15 分鐘 (1.1km)" }
      ]
    };

    let map;
    let places = [];
    let markers = [];
    let centerMarker = null;
    let radarCircle = null;
    let activeInfoWindow = null;
    let activeIdx = RADAR_CONFIG.defaultIndex;

    // 預設中心點 (預設台北，若授權定位則會自動切換為使用者位置)
    let searchCenter = { lat: 25.0330, lng: 121.5654 };

    // Haversine 大圓距離計算 (公尺)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function initMap() {
      const curOpt = RADAR_CONFIG.options[activeIdx];

      map = new google.maps.Map(document.getElementById('map'), {
        center: searchCenter,
        zoom: curOpt.zoom,
        gestureHandling: 'greedy', // 單指即可自由平移拖曳
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        clickableIcons: false
      });

      // 建立中心藍色圓點
      centerMarker = new google.maps.Marker({
        position: searchCenter,
        map: map,
        draggable: true,
        cursor: 'grab',
        title: "長按拖曳以移動搜尋中心",
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: "#1976d2",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2.5
        }
      });

      // 長按拖曳放開後更新中心
      centerMarker.addListener('dragend', function(e) {
        searchCenter = { lat: e.latLng.lat(), lng: e.latLng.lng() };
        updateRadarVisuals(false);
        filterAndRenderPlaces();
      });

      // 單擊地圖任一處瞬移藍點
      map.addListener('click', function(e) {
        searchCenter = { lat: e.latLng.lat(), lng: e.latLng.lng() };
        centerMarker.setPosition(searchCenter);
        updateRadarVisuals(false);
        filterAndRenderPlaces();
      });

      bindUIEvents();
      updateRadarVisuals(true);
      fetchPlaces();
      tryLocateUser();
    }

    function bindUIEvents() {
      // 點擊頂部按鈕切換半徑
      const buttons = document.querySelectorAll('.radar-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeIdx = parseInt(btn.getAttribute('data-idx'), 10);
          updateRadarVisuals(true);
          filterAndRenderPlaces();
        });
      });

      // 回到目前位置
      document.getElementById('recenterBtn').addEventListener('click', tryLocateUser);
    }

    function updateRadarVisuals(shouldPanZoom) {
      const opt = RADAR_CONFIG.options[activeIdx];

      if (radarCircle) {
        radarCircle.setMap(null);
      }

      radarCircle = new google.maps.Circle({
        strokeColor: "#1976d2",
        strokeOpacity: 0.6,
        strokeWeight: 1.5,
        fillColor: "#1976d2",
        fillOpacity: 0.06,
        map: map,
        center: searchCenter,
        radius: opt.meters
      });

      if (shouldPanZoom) {
        map.panTo(searchCenter);
        map.setZoom(opt.zoom);
      }
    }

    function tryLocateUser() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          searchCenter = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          centerMarker.setPosition(searchCenter);
          updateRadarVisuals(true);
          filterAndRenderPlaces();
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    async function fetchPlaces() {
      try {
        const res = await fetch('places.json?v=' + Date.now());
        if (!res.ok) throw new Error();
        places = await res.json();
        filterAndRenderPlaces();
      } catch (err) {
        document.getElementById('statusText').innerText = "未載入 places.json";
      }
    }

    // 依中心點與半徑過濾店家，並繪製橘色標記
    function filterAndRenderPlaces() {
      // 清空原有標記
      markers.forEach(m => m.setMap(null));
      markers = [];
      if (activeInfoWindow) activeInfoWindow.close();

      const opt = RADAR_CONFIG.options[activeIdx];
      let matchCount = 0;

      places.forEach(p => {
        if (!p.lat || !p.lng) return;
        const d = getDistance(searchCenter.lat, searchCenter.lng, p.lat, p.lng);

        if (d <= opt.meters) {
          matchCount++;
          const walkUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`;

          // 原生 Google 地圖橘色圖標
          const marker = new google.maps.Marker({
            position: { lat: p.lat, lng: p.lng },
            map: map,
            title: p.name,
            icon: {
              url: "https://maps.google.com/mapfiles/ms/icons/orange-dot.png"
            }
          });

          // 與截圖完全一致的 InfoWindow 內容
          const contentStr = `
            <div class="info-card">
              <div class="info-title">${p.name}</div>
              ${p.badge ? `<div class="info-badge-box">${p.badge}</div>` : ''}
              ${p.must_try ? `<div class="info-line">🥖 必點：${p.must_try}</div>` : ''}
              ${p.tip ? `<div class="info-line">💡 秘訣：${p.tip}</div>` : ''}
              <div class="info-dist">🚶 距離搜尋中心約 ${Math.round(d)} 公尺</div>
              <a class="info-nav-btn" href="${walkUrl}" target="_blank">開始步行導航</a>
            </div>
          `;

          const infoWindow = new google.maps.InfoWindow({ content: contentStr });

          marker.addListener('click', () => {
            if (activeInfoWindow) activeInfoWindow.close();
            infoWindow.open(map, marker);
            activeInfoWindow = infoWindow;
          });

          markers.push(marker);
        }
      });

      // 更新頂部「步行 X 分鐘內發現 Y 間好店」
      document.getElementById('statusText').innerText = `步行 ${opt.minutes} 分鐘內發現 ${matchCount} 間好店`;
    }
  </script>

  <script 
    src="https://maps.googleapis.com/maps/api/js?key=__MAPS_API_KEY__&callback=initMap" 
    async defer>
  </script>
</body>
</html>
