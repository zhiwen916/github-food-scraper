<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>私房美食探索雷達</title>
  
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* 頂部控制面板 */
    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-wrap {
      font-size: 15px;
      font-weight: 700;
      color: #202124;
      display: flex;
      align-items: center;
    }
    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #34a853;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .action-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 時間與交通工具切換標籤 */
    .time-selector {
      display: flex;
      background: #f1f3f4;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
      white-space: nowrap;
      align-items: center;
    }
    .time-opt {
      flex: 1 1 auto;
      text-align: center;
      padding: 6px 3px;
      font-size: 11px;
      font-weight: bold;
      color: #5f6368;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .time-opt.active {
      background: #ffffff;
      color: #1a73e8;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .time-opt.transit-opt.active {
      color: #e37400;
    }
    .time-opt .icon {
      font-size: 14px;
      line-height: 1;
      display: inline-block;
    }

    /* 操作提示欄 */
    .hint-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fef9e7;
      border: 1px solid #f9e79f;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      color: #7d6608;
      font-weight: 500;
    }

    /* POI 資訊卡片 */
    .poi-card {
      padding: 6px 4px;
      max-width: 260px;
    }
    .poi-card h3 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #1a73e8;
    }
    .badge-tag {
      display: inline-block;
      background: #e8f0fe;
      color: #1967d2;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .poi-card .detail {
      font-size: 12px;
      color: #3c4043;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .nav-button {
      display: block;
      width: 100%;
      text-align: center;
      color: #ffffff !important;
      text-decoration: none;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
    }
    .nav-walking { background: #1a73e8; }
    .nav-transit { background: #e37400; }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="panel-row">
      <div class="status-wrap">
        <span class="status-badge" id="statusDot"></span>
        <span id="statusText">載入私房名單中...</span>
      </div>
      <button class="action-btn" onclick="resetToCurrentGPS()">回到目前位置</button>
    </div>
    
    <div class="time-selector" id="timeSelectorContainer"></div>

    <div class="hint-bar">
      💡 點擊地圖任一處，或長按拖曳藍色圓點即可更改搜尋中心
    </div>
  </div>

  <div id="map"></div>

  <script>
    // ==========================================
    // ⚙️ 集中設定區：時間與半徑矩陣
    // ==========================================
    const RADAR_CONFIG = {
      defaultIndex: 0,
      options: [
        {
          mode: 'walk',
          minutes: 7,
          meters: 500,        // 7 分鐘步行約 500 公尺[cite: 1]
          zoom: 16.5,
          icon: '🚶',
          label: '7分'
        },
        {
          mode: 'walk',
          minutes: 10,
          meters: 750,        // 10 分鐘步行約 750 公尺
          zoom: 16.0,
          icon: '🚶',
          label: '10分'
        },
        {
          mode: 'walk',
          minutes: 15,
          meters: 1100,       // 15 分鐘步行約 1.1 公里
          zoom: 15.5,
          icon: '🚶',
          label: '15分'
        },
        {
          mode: 'transit',
          minutes: 30,
          meters: 5000,       // 捷運公車 30 分鐘約 5 公里
          zoom: 13.5,
          icon: '🚌',
          label: '捷運/公車 30分'
        }
      ]
    };

    let map;
    let centerMarker;
    let circleRange;
    let infoWindow;
    let geocoder;
    
    let activeOption = RADAR_CONFIG.options[RADAR_CONFIG.defaultIndex];
    // 預設以台北大巨蛋/信義區為中心，方便直接命中試算表資料
    let activeCenterPos = { lat: 25.0422, lng: 121.5600 };
    let realDeviceGPS = null;
    let allCachedPlaces = [];
    let currentStoreMarkers = [];

    function renderTimeSelectorUI() {
      const container = document.getElementById("timeSelectorContainer");
      container.innerHTML = "";

      RADAR_CONFIG.options.forEach((opt, idx) => {
        const btn = document.createElement("div");
        const isActive = idx === RADAR_CONFIG.defaultIndex;
        btn.className = `time-opt ${opt.mode === 'transit' ? 'transit-opt' : ''} ${isActive ? 'active' : ''}`;
        btn.innerHTML = `<span class="icon">${opt.icon}</span>${opt.label}`;
        btn.onclick = () => selectModeByIndex(idx);
        container.appendChild(btn);
      });
    }

    function selectModeByIndex(index) {
      activeOption = RADAR_CONFIG.options[index];

      const buttons = document.querySelectorAll(".time-opt");
      buttons.forEach((btn, i) => btn.classList.toggle("active", i === index));

      if (circleRange) {
        circleRange.setRadius(activeOption.meters);
        circleRange.setOptions({
          strokeColor: activeOption.mode === 'transit' ? '#e37400' : '#1a73e8',
          fillColor: activeOption.mode === 'transit' ? '#e37400' : '#1a73e8'
        });
      }

      if (map && activeCenterPos) {
        map.setZoom(activeOption.zoom);
      }

      filterAndRenderStores();
    }

    function initMap() {
      renderTimeSelectorUI();

      infoWindow = new google.maps.InfoWindow();
      geocoder = new google.maps.Geocoder();

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: activeOption.zoom,
        center: activeCenterPos,
        gestureHandling: 'greedy', // 單指平移
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false
      });

      // 點擊地圖任一處更改中心
      map.addListener("click", (e) => {
        updateSearchCenter(e.latLng);
      });

      setupCenterMarkerAndCircle(activeCenterPos);
      startApp();
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function setStatus(text, color) {
      document.getElementById("statusText").innerText = text;
      document.getElementById("statusDot").style.background = color;
    }

    async function startApp() {
      await fetchStoreData();

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          realDeviceGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          activeCenterPos = { ...realDeviceGPS };
          map.setCenter(activeCenterPos);
          updateSearchCenter(activeCenterPos);
        }, () => {
          filterAndRenderStores();
        }, { enableHighAccuracy: true });
      } else {
        filterAndRenderStores();
      }
    }

    function setupCenterMarkerAndCircle(latLng) {
      if (centerMarker) centerMarker.setMap(null);
      if (circleRange) circleRange.setMap(null);

      centerMarker = new google.maps.Marker({
        position: latLng,
        map: map,
        draggable: true,
        title: "拖曳我可更改搜尋中心",
        zIndex: 999,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: "#1a73e8",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 3
        }
      });

      centerMarker.addListener("dragend", (e) => {
        updateSearchCenter(e.latLng);
      });

      circleRange = new google.maps.Circle({
        strokeColor: activeOption.mode === 'transit' ? '#e37400' : '#1a73e8',
        strokeOpacity: 0.35,
        strokeWeight: 1.5,
        fillColor: activeOption.mode === 'transit' ? '#e37400' : '#1a73e8',
        fillOpacity: 0.08,
        map: map,
        center: latLng,
        radius: activeOption.meters
      });
    }

    function updateSearchCenter(newLatLng) {
      activeCenterPos = {
        lat: typeof newLatLng.lat === 'function' ? newLatLng.lat() : newLatLng.lat,
        lng: typeof newLatLng.lng === 'function' ? newLatLng.lng() : newLatLng.lng
      };
      centerMarker.setPosition(activeCenterPos);
      circleRange.setCenter(activeCenterPos);
      filterAndRenderStores();
    }

    function resetToCurrentGPS() {
      if (realDeviceGPS) {
        updateSearchCenter(realDeviceGPS);
        map.panTo(realDeviceGPS);
      } else {
        startApp();
      }
    }

    // 直接讀取由試算表同步產生的 places.json，地址缺經緯度時自動補查
    async function fetchStoreData() {
      setStatus("載入私房名單中...", "#fbbc05");
      try {
        const res = await fetch('places.json?v=' + Date.now());
        if (!res.ok) throw new Error("places.json 不存在");
        const places = await res.json();

        allCachedPlaces = [];
        const geocodePromises = places.map(place => {
          if (place.lat && place.lng) {
            allCachedPlaces.push(place);
            return Promise.resolve();
          }
          // 若 places.json 尚未帶有經緯度，以地址向 Google 地圖做 Geocoding
          return new Promise((resolve) => {
            geocoder.geocode({ address: place.address || place.city || "台北市" }, (results, status) => {
              if (status === "OK" && results[0]) {
                place.lat = results[0].geometry.location.lat();
                place.lng = results[0].geometry.location.lng();
                allCachedPlaces.push(place);
              }
              resolve();
            });
          });
        });

        await Promise.all(geocodePromises);
        filterAndRenderStores();
      } catch (err) {
        setStatus("請在試算表點擊一鍵同步", "#ea4335");
      }
    }

    function filterAndRenderStores() {
      if (!activeCenterPos) return;

      currentStoreMarkers.forEach(m => m.setMap(null));
      currentStoreMarkers = [];

      let count = 0;
      allCachedPlaces.forEach(place => {
        if (!place.lat || !place.lng) return;
        const dist = getDistanceMeters(activeCenterPos.lat, activeCenterPos.lng, place.lat, place.lng);
        if (dist <= activeOption.meters) {
          count++;
          createPlaceMarker(place, { lat: place.lat, lng: place.lng }, Math.round(dist));
        }
      });

      const modeText = activeOption.mode === 'transit' 
        ? `大眾運輸 ${activeOption.minutes} 分鐘內` 
        : `步行 ${activeOption.minutes} 分鐘內`;
      setStatus(`${modeText} 發現 ${count} 間好店`, "#34a853");
    }

    function createPlaceMarker(place, location, distMeters) {
      const marker = new google.maps.Marker({
        map: map,
        position: location,
        title: place.name,
        icon: {
          url: activeOption.mode === 'transit' 
            ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png" 
            : "https://maps.google.com/mapfiles/ms/icons/orange-dot.png"
        }
      });

      const startLat = realDeviceGPS ? realDeviceGPS.lat : activeCenterPos.lat;
      const startLng = realDeviceGPS ? realDeviceGPS.lng : activeCenterPos.lng;
      const travelModeParam = activeOption.mode === 'transit' ? 'transit' : 'walking';

      const destinationQuery = encodeURIComponent(`${place.name} (${location.lat},${location.lng})`);
      const navUrl = `https://www.google.com/maps/dir/?api=1&origin=${startLat},${startLng}&destination=${destinationQuery}&travelmode=${travelModeParam}`;

      const btnLabel = activeOption.mode === 'transit' ? "搭車導航 (公車 / 捷運)" : "開始步行導航";
      const btnClass = activeOption.mode === 'transit' ? "nav-transit" : "nav-walking";
      const distLabel = distMeters >= 1000 ? `${(distMeters / 1000).toFixed(1)} 公里` : `${distMeters} 公尺`;

      const content = `
        <div class="poi-card">
          <h3>${place.name}</h3>
          <div class="badge-tag">${place.badge || place.category || '私房推薦'}</div>
          ${place.must_try ? `<div class="detail">🥖 <b>必點</b>：${place.must_try}</div>` : ''}
          ${place.tip ? `<div class="detail">💡 <b>秘訣</b>：${place.tip}</div>` : ''}
          <div class="detail" style="color:#666;">📍 直線距離約 ${distLabel}</div>
          <a class="nav-button ${btnClass}" href="${navUrl}" target="_blank" rel="noopener">
            ${btnLabel}
          </a>
        </div>
      `;

      marker.addListener("click", () => {
        infoWindow.setContent(content);
        infoWindow.open(map, marker);
      });

      currentStoreMarkers.push(marker);
    }
  </script>

  <!-- 請將 YOUR_MAPS_API_KEY 替換為你在 GitHub Secret 儲存的 MAPS_API_KEY -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_MAPS_API_KEY&callback=initMap" 
    async defer>
  </script>
</body>
</html>
