<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>私房美食探索雷達</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* 頂部控制面板 */
    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-wrap {
      font-size: 15px;
      font-weight: 700;
      color: #202124;
      display: flex;
      align-items: center;
    }
    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fbbc05;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .action-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 時間與交通工具切換標籤 */
    .time-selector {
      display: flex;
      background: #f1f3f4;
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .time-opt {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      font-size: 12px;
      font-weight: bold;
      color: #5f6368;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .time-opt.active {
      background: #ffffff;
      color: #1a73e8;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .time-opt.transit-opt.active {
      color: #e37400; /* 大眾運輸模式使用橙色高亮 */
    }

    /* 操作指引條 */
    .hint-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef3fc;
      border: 1px dashed #c2d7fa;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      color: #1a73e8;
      font-weight: 500;
    }

    /* POI 資訊卡片 */
    .poi-card {
      padding: 4px;
      max-width: 260px;
    }
    .poi-card h3 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #1a73e8;
    }
    .badge-tag {
      display: inline-block;
      background: #e8f0fe;
      color: #1967d2;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .poi-card .detail {
      font-size: 12px;
      color: #444;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .nav-button {
      display: block;
      width: 100%;
      text-align: center;
      color: #ffffff !important;
      text-decoration: none;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
    }
    .nav-walking {
      background: #1a73e8;
    }
    .nav-transit {
      background: #e37400;
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="panel-row">
      <div class="status-wrap">
        <span class="status-badge" id="statusDot"></span>
        <span id="statusText">GPS 定位中...</span>
      </div>
      <button class="action-btn" onclick="resetToCurrentGPS()">回到目前位置</button>
    </div>
    
    <!-- 步行與大眾運輸模式切換 -->
    <div class="time-selector">
      <div class="time-opt active" onclick="setMode('walk', 7, 500, 16.5, this)">🚶 7 分鐘</div>
      <div class="time-opt" onclick="setMode('walk', 10, 750, 16.0, this)">🚶 10 分鐘</div>
      <div class="time-opt" onclick="setMode('walk', 15, 1100, 15.5, this)">🚶 15 分鐘</div>
      <div class="time-opt transit-opt" onclick="setMode('transit', 30, 5000, 13.5, this)">🚌 捷運公車 30分</div>
    </div>

    <!-- 操作提示 -->
    <div class="hint-bar">
      💡 點擊地圖任一處，或長按拖曳藍色圓點即可更改搜尋中心
    </div>
  </div>

  <div id="map"></div>

  <script>
    const GAS_API_URL = "__GAS_API_URL__";

    let map;
    let centerMarker;
    let circleRange;
    let infoWindow;
    let geocoder;
    
    // 狀態設定
    let currentMode = 'walk';       // 'walk' 或 'transit'
    let searchRadius = 500;        // 預設 500 公尺 (步行 7 分鐘)[cite: 1]
    let selectedMinutes = 7;
    let activeCenterPos = null;    // 搜尋圓心
    let realDeviceGPS = null;      // 真實手機位置
    let allCachedPlaces = [];
    let currentStoreMarkers = [];

    function initMap() {
      infoWindow = new google.maps.InfoWindow();
      geocoder = new google.maps.Geocoder();

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16.5,
        center: { lat: 25.0339, lng: 121.5644 },
        disableDefaultUI: false,
        zoomControl: true,
        mapTypeControl: false,
        streetViewControl: false
      });

      // 點擊地圖任意處手動改設中心點
      map.addListener("click", (e) => {
        updateSearchCenter(e.latLng);
      });

      startApp();
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function setStatus(text, color) {
      document.getElementById("statusText").innerText = text;
      document.getElementById("statusDot").style.background = color;
    }

    // 切換交通工具與時間半徑
    function setMode(mode, minutes, meters, targetZoom, elem) {
      currentMode = mode;
      selectedMinutes = minutes;
      searchRadius = meters;

      document.querySelectorAll(".time-opt").forEach(el => el.classList.remove("active"));
      elem.classList.add("active");

      // 動態更新半徑圈樣式（大眾運輸用橙色表示）
      if (circleRange) {
        circleRange.setRadius(searchRadius);
        circleRange.setOptions({
          strokeColor: mode === 'transit' ? '#e37400' : '#1a73e8',
          fillColor: mode === 'transit' ? '#e37400' : '#1a73e8'
        });
      }

      // 自動調整地圖縮放比例
      if (map && activeCenterPos) {
        map.setZoom(targetZoom);
      }

      filterAndRenderStores();
    }

    async function startApp() {
      setStatus("取得 GPS 定位中...", "#fbbc05");

      if (!navigator.geolocation) {
        alert("瀏覽器不支援定位功能");
        return;
      }

      navigator.geolocation.getCurrentPosition(async (pos) => {
        realDeviceGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        activeCenterPos = { ...realDeviceGPS };

        map.setCenter(activeCenterPos);
        setupCenterMarkerAndCircle(activeCenterPos);

        await fetchStoreData();
        filterAndRenderStores();
      }, () => {
        setStatus("請允許定位權限 (預設台北市)", "#ea4335");
        activeCenterPos = { lat: 25.0339, lng: 121.5644 };
        setupCenterMarkerAndCircle(activeCenterPos);
        fetchStoreData().then(() => filterAndRenderStores());
      }, { enableHighAccuracy: true });
    }

    function setupCenterMarkerAndCircle(latLng) {
      if (centerMarker) centerMarker.setMap(null);
      if (circleRange) circleRange.setMap(null);

      centerMarker = new google.maps.Marker({
        position: latLng,
        map: map,
        draggable: true,
        title: "拖曳我可更改搜尋中心",
        zIndex: 999,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: "#1a73e8",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 3
        }
      });

      centerMarker.addListener("dragend", (e) => {
        updateSearchCenter(e.latLng);
      });

      circleRange = new google.maps.Circle({
        strokeColor: currentMode === 'transit' ? '#e37400' : '#1a73e8',
        strokeOpacity: 0.35,
        strokeWeight: 1.5,
        fillColor: currentMode === 'transit' ? '#e37400' : '#1a73e8',
        fillOpacity: 0.08,
        map: map,
        center: latLng,
        radius: searchRadius
      });
    }

    function updateSearchCenter(newLatLng) {
      activeCenterPos = {
        lat: typeof newLatLng.lat === 'function' ? newLatLng.lat() : newLatLng.lat,
        lng: typeof newLatLng.lng === 'function' ? newLatLng.lng() : newLatLng.lng
      };
      centerMarker.setPosition(activeCenterPos);
      circleRange.setCenter(activeCenterPos);
      filterAndRenderStores();
    }

    function resetToCurrentGPS() {
      if (realDeviceGPS) {
        updateSearchCenter(realDeviceGPS);
        map.panTo(realDeviceGPS);
      } else {
        startApp();
      }
    }

    async function fetchStoreData() {
      setStatus("載入私房好店中...", "#fbbc05");
      try {
        const res = await fetch(GAS_API_URL);
        const places = await res.json();

        allCachedPlaces = [];
        const geocodePromises = places.map(place => {
          return new Promise((resolve) => {
            geocoder.geocode({ address: place.address }, (results, status) => {
              if (status === "OK" && results[0]) {
                place.lat = results[0].geometry.location.lat();
                place.lng = results[0].geometry.location.lng();
                allCachedPlaces.push(place);
              }
              resolve();
            });
          });
        });

        await Promise.all(geocodePromises);
      } catch (err) {
        setStatus("資料庫載入失敗", "#ea4335");
      }
    }

    function filterAndRenderStores() {
      if (!activeCenterPos) return;

      currentStoreMarkers.forEach(m => m.setMap(null));
      currentStoreMarkers = [];

      let count = 0;
      allCachedPlaces.forEach(place => {
        const dist = getDistanceMeters(activeCenterPos.lat, activeCenterPos.lng, place.lat, place.lng);
        if (dist <= searchRadius) {
          count++;
          createPlaceMarker(place, { lat: place.lat, lng: place.lng }, Math.round(dist));
        }
      });

      const modeText = currentMode === 'transit' ? "大眾運輸 30 分鐘內" : `步行 ${selectedMinutes} 分鐘內`;
      setStatus(`${modeText} 發現 ${count} 間好店`, "#34a853");
    }

    function createPlaceMarker(place, location, distMeters) {
      const marker = new google.maps.Marker({
        map: map,
        position: location,
        title: place.name,
        icon: {
          url: currentMode === 'transit' 
            ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png" 
            : "https://maps.google.com/mapfiles/ms/icons/orange-dot.png"
        }
      });

      const startLat = realDeviceGPS ? realDeviceGPS.lat : activeCenterPos.lat;
      const startLng = realDeviceGPS ? realDeviceGPS.lng : activeCenterPos.lng;
      const travelModeParam = currentMode === 'transit' ? 'transit' : 'walking';

      // 🌟 優先以「店名」導航，並在後方附帶經緯度作為備援防線
      // 格式：encodeURIComponent("店名 (緯度,經度)")
      const destinationQuery = encodeURIComponent(`${place.name} (${location.lat},${location.lng})`);

      // 產生 Google 地圖通用導航網址
      const navUrl = `https://www.google.com/maps/dir/?api=1&origin=${startLat},${startLng}&destination=${destinationQuery}&travelmode=${travelModeParam}`;

      const btnLabel = currentMode === 'transit' ? "搭車導航 (公車 / 捷運)" : "開始步行導航";
      const btnClass = currentMode === 'transit' ? "nav-transit" : "nav-walking";
      const distLabel = distMeters >= 1000 ? `${(distMeters / 1000).toFixed(1)} 公里` : `${distMeters} 公尺`;

      const content = `
        <div class="poi-card">
          <h3>${place.name}</h3>
          <div class="badge-tag">${place.badge || place.category}</div>
          <div class="detail">🥖 <b>必點</b>：${place.must_try}</div>
          <div class="detail">💡 <b>秘訣</b>：${place.tip}</div>
          <div class="detail" style="color:#666;">📍 直線距離約 ${distLabel}</div>
          <a class="nav-button ${btnClass}" href="${navUrl}" target="_blank" rel="noopener">
            ${btnLabel}
          </a>
        </div>
      `;

      marker.addListener("click", () => {
        infoWindow.setContent(content);
        infoWindow.open(map, marker);
      });

      currentStoreMarkers.push(marker);
    }
  </script>

  <script 
    src="https://maps.googleapis.com/maps/api/js?key=__MAPS_API_KEY__&callback=initMap" 
    async defer>
  </script>
</body>
</html>
