<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>私房步行好店雷達</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* 頂部浮動控制面板 */
    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-wrap {
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
    }
    .status-badge {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fbbc05;
      margin-right: 6px;
    }
    .action-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 步行時間切換藥丸標籤 (Pill Tabs) */
    .time-selector {
      display: flex;
      background: #f1f3f4;
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .time-opt {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      font-size: 12px;
      font-weight: bold;
      color: #5f6368;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .time-opt.active {
      background: #ffffff;
      color: #1a73e8;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    /* POI 資訊卡片 */
    .poi-card {
      padding: 4px;
      max-width: 260px;
    }
    .poi-card h3 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #1a73e8;
    }
    .badge-tag {
      display: inline-block;
      background: #e8f0fe;
      color: #1967d2;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .poi-card .detail {
      font-size: 12px;
      color: #444;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .nav-button {
      display: block;
      width: 100%;
      text-align: center;
      background: #1a73e8;
      color: #ffffff !important;
      text-decoration: none;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="panel-row">
      <div class="status-wrap">
        <span class="status-badge" id="statusDot"></span>
        <span id="statusText">GPS 定位中...</span>
      </div>
      <button class="action-btn" onclick="resetToCurrentGPS()">回到目前位置</button>
    </div>
    
    <!-- 步行時間切換 -->
    <div class="time-selector">
      <div class="time-opt active" onclick="setWalkingTime(7, 500, this)">7 分鐘 (500m)</div>
      <div class="time-opt" onclick="setWalkingTime(10, 750, this)">10 分鐘 (750m)</div>
      <div class="time-opt" onclick="setWalkingTime(15, 1100, this)">15 分鐘 (1.1km)</div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const GAS_API_URL = "__GAS_API_URL__";

    let map;
    let centerMarker;
    let circleRange;
    let infoWindow;
    let geocoder;
    
    // 狀態變數
    let searchRadius = 500; // 預設 7 分鐘 (500m)
    let selectedMinutes = 7;
    let activeCenterPos = null; // 當前探索圓心 (可手動拖曳或點選)
    let realDeviceGPS = null;   // 真實 GPS 位置 (導航起點)
    let allCachedPlaces = [];   // 快取試算表好店資料
    let currentStoreMarkers = []; // 當前繪製在地圖上的店家標記

    function initMap() {
      infoWindow = new google.maps.InfoWindow();
      geocoder = new google.maps.Geocoder();

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16.5,
        center: { lat: 25.0339, lng: 121.5644 },
        disableDefaultUI: false,
        zoomControl: true,
        mapTypeControl: false,
        streetViewControl: false
      });

      // 支援在地圖任意處「點擊」快速將圓心移到該處
      map.addListener("click", (e) => {
        updateSearchCenter(e.latLng);
      });

      startApp();
    }

    // 計算經緯度距離 (公尺)
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function setStatus(text, color) {
      document.getElementById("statusText").innerText = text;
      document.getElementById("statusDot").style.background = color;
    }

    // 切換步行時間
    function setWalkingTime(minutes, meters, elem) {
      selectedMinutes = minutes;
      searchRadius = meters;
      document.querySelectorAll(".time-opt").forEach(el => el.classList.remove("active"));
      elem.classList.add("active");

      if (circleRange) {
        circleRange.setRadius(searchRadius);
      }
      filterAndRenderStores();
    }

    async function startApp() {
      setStatus("取得 GPS 定位中...", "#fbbc05");

      if (!navigator.geolocation) {
        alert("瀏覽器不支援定位");
        return;
      }

      navigator.geolocation.getCurrentPosition(async (pos) => {
        realDeviceGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        activeCenterPos = { ...realDeviceGPS };

        map.setCenter(activeCenterPos);
        setupCenterMarkerAndCircle(activeCenterPos);

        // 載入試算表資料
        await fetchStoreData();
        filterAndRenderStores();
      }, () => {
        setStatus("請允許定位權限 (預設台北市)", "#ea4335");
        activeCenterPos = { lat: 25.0339, lng: 121.5644 };
        setupCenterMarkerAndCircle(activeCenterPos);
        fetchStoreData().then(() => filterAndRenderStores());
      }, { enableHighAccuracy: true });
    }

    // 設定可拖曳中心錨點與步行圈
    function setupCenterMarkerAndCircle(latLng) {
      if (centerMarker) centerMarker.setMap(null);
      if (circleRange) circleRange.setMap(null);

      centerMarker = new google.maps.Marker({
        position: latLng,
        map: map,
        draggable: true, // 允許手動拖曳選點
        title: "拖曳我或點擊地圖以更改搜尋中心",
        zIndex: 999,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: "#1a73e8",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 3
        }
      });

      // 拖曳結束時更新搜尋中心
      centerMarker.addListener("dragend", (e) => {
        updateSearchCenter(e.latLng);
      });

      circleRange = new google.maps.Circle({
        strokeColor: "#1a73e8",
        strokeOpacity: 0.35,
        strokeWeight: 1.5,
        fillColor: "#1a73e8",
        fillOpacity: 0.08,
        map: map,
        center: latLng,
        radius: searchRadius
      });
    }

    function updateSearchCenter(newLatLng) {
      activeCenterPos = {
        lat: typeof newLatLng.lat === 'function' ? newLatLng.lat() : newLatLng.lat,
        lng: typeof newLatLng.lng === 'function' ? newLatLng.lng() : newLatLng.lng
      };
      centerMarker.setPosition(activeCenterPos);
      circleRange.setCenter(activeCenterPos);
      filterAndRenderStores();
    }

    function resetToCurrentGPS() {
      if (realDeviceGPS) {
        updateSearchCenter(realDeviceGPS);
        map.panTo(realDeviceGPS);
      } else {
        startApp();
      }
    }

    async function fetchStoreData() {
      setStatus("載入私房好店中...", "#fbbc05");
      try {
        const res = await fetch(GAS_API_URL);
        const places = await res.json();

        // 預先透過 Geocoder 解析並快取座標
        allCachedPlaces = [];
        const geocodePromises = places.map(place => {
          return new Promise((resolve) => {
            geocoder.geocode({ address: place.address }, (results, status) => {
              if (status === "OK" && results[0]) {
                place.lat = results[0].geometry.location.lat();
                place.lng = results[0].geometry.location.lng();
                allCachedPlaces.push(place);
              }
              resolve();
            });
          });
        });

        await Promise.all(geocodePromises);
      } catch (err) {
        setStatus("資料庫載入失敗", "#ea4335");
      }
    }

    // 根據當前圓心與選定的半徑篩選出店家並標記
    function filterAndRenderStores() {
      if (!activeCenterPos) return;

      // 清除先前的店家標記
      currentStoreMarkers.forEach(m => m.setMap(null));
      currentStoreMarkers = [];

      let count = 0;
      allCachedPlaces.forEach(place => {
        const dist = getDistanceMeters(activeCenterPos.lat, activeCenterPos.lng, place.lat, place.lng);
        if (dist <= searchRadius) {
          count++;
          createPlaceMarker(place, { lat: place.lat, lng: place.lng }, Math.round(dist));
        }
      });

      setStatus(`步行 ${selectedMinutes} 分鐘內發現 ${count} 間好店`, "#34a853");
    }

    function createPlaceMarker(place, location, distMeters) {
      const marker = new google.maps.Marker({
        map: map,
        position: location,
        title: place.name,
        icon: {
          url: "https://maps.google.com/mapfiles/ms/icons/orange-dot.png"
        }
      });

      // 導航起點：若有真實 GPS 則以真實 GPS 為起點，否則以手動點選點為起點
      const startLat = realDeviceGPS ? realDeviceGPS.lat : activeCenterPos.lat;
      const startLng = realDeviceGPS ? realDeviceGPS.lng : activeCenterPos.lng;
      const navUrl = `https://www.google.com/maps/dir/?api=1&origin=${startLat},${startLng}&destination=${location.lat},${location.lng}&travelmode=walking`;

      const content = `
        <div class="poi-card">
          <h3>${place.name}</h3>
          <div class="badge-tag">${place.badge || place.category}</div>
          <div class="detail">🥖 <b>必點</b>：${place.must_try}</div>
          <div class="detail">💡 <b>秘訣</b>：${place.tip}</div>
          <div class="detail" style="color:#666;">🚶 距離搜尋中心約 ${distMeters} 公尺</div>
          <a class="nav-button" href="${navUrl}" target="_blank" rel="noopener">
            開始步行導航
          </a>
        </div>
      `;

      marker.addListener("click", () => {
        infoWindow.setContent(content);
        infoWindow.open(map, marker);
      });

      currentStoreMarkers.push(marker);
    }
  </script>

  <script 
    src="https://maps.googleapis.com/maps/api/js?key=__MAPS_API_KEY__&callback=initMap" 
    async defer>
  </script>
</body>
</html>
