name: Hourly Food Scraper (24h Paced)

on:
  schedule:
    # 每個小時整點 (UTC 0分) 自動執行一次，全天均勻執行 24 輪
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate Vertex AI
        env:
          GCP_KEY_DATA: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "$GCP_KEY_DATA" > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> $GITHUB_ENV
      
      - name: Run Food Scraper
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python scraper.py
