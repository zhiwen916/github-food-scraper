name: Deploy Radar to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets into index.html
        run: |
          # 替換 MAPS_API_KEY 與 GAS_API_URL 佔位符
          sed -i 's|__MAPS_API_KEY__|${{ secrets.MAPS_API_KEY }}|g' index.html
          sed -i 's|__GAS_API_URL__|${{ secrets.GAS_API_URL }}|g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
